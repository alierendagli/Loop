name: Build Loop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode select
        run: sudo xcode-select -switch /Applications/Xcode.app
      - name: Install dependencies
        run: brew install carthage
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies
      - name: Build IPA
        run: xcodebuild -scheme Loop -workspace Loop.xcworkspace -sdk iphoneos -configuration Release archive -archivePath $PWD/build/Loop.xcarchive
      - name: Export IPA
        run: xcodebuild -exportArchive -archivePath $PWD/build/Loop.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $PWD/build
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loop
          path: build/*.ipa
