name: Build Loop (No Team ID)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode select
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Install dependencies
        run: brew install carthage

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies

      - name: Disable code signing
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          find . -name "project.pbxproj" -print0 | xargs -0 sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g'
          find . -name "project.pbxproj" -print0 | xargs -0 sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g'
          find . -name "project.pbxproj" -print0 | xargs -0 sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";//g'

      - name: Build IPA
        run: xcodebuild -scheme Loop -workspace Loop.xcworkspace -sdk iphoneos -configuration Release archive -archivePath $PWD/build/Loop.xcarchive CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: xcodebuild -exportArchive -archivePath $PWD/build/Loop.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $PWD/build CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loop
          path: build/*.ipa
